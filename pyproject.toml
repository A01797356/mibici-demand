[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici_demand"
version = "0.0.1"
description = "Predicción de demanda de MiBici por estación · Proyecto MLOps Equipo 03"
authors = [
  { name = "Equipo 03" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["mibici_demand"]
include = ["pyproject.toml", "mibici_demand/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici_demand"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
